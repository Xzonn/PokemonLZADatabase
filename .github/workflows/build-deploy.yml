name: Build and Deploy to Tencent Cloud COS

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Setup Node.js v22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      # 3. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      
      # 4. Get pnpm store directory
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      # 5. Setup pnpm cache
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      # 6. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      # 7. Build project
      - name: Build project
        run: pnpm run build
      
      # 8. Setup COSCLI cache
      - name: Cache COSCLI
        id: cache-coscli
        uses: actions/cache@v4
        with:
          path: ~/coscli
          key: ${{ runner.os }}-coscli-v5.0.32
          restore-keys: |
            ${{ runner.os }}-coscli-
      
      # 9. Download and install COSCLI
      - name: Download and install COSCLI
        if: steps.cache-coscli.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/coscli
          wget --retry-connrefused --waitretry=1 --read-timeout=20 --timeout=15 -t 3 \
            -O ~/coscli/coscli https://github.com/tencentyun/coscli/releases/download/v5.0.32/coscli-linux
          chmod +x ~/coscli/coscli
      
      # 10. Configure COSCLI
      - name: Configure COSCLI
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
        run: |
          ~/coscli/coscli config init -s "$COS_SECRET_ID" -k "$COS_SECRET_KEY" -r "$COS_REGION" -b "$COS_BUCKET"
      
      # 11. Deploy to Tencent Cloud COS
      - name: Deploy to Tencent Cloud COS
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
        run: |
          ~/coscli/coscli sync build/ cos://"$COS_BUCKET"/ -r --delete
